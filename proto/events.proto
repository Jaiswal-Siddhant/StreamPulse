syntax = "proto3";

package streampulse.v1;

option go_package = "github.com/jaiswaladi246/streampulse/proto/streampulsev1";

service EventService {
  rpc Publish(PublishRequest) returns (PublishResponse);
  rpc PublishStream(stream PublishRequest) returns (PublishSummary);
}

message Event {
  string event_id = 1;
  string event_type = 2;
  string source = 3;
  int64 occurred_at_ms = 4;
  uint32 schema_version = 5;
  bytes payload_json = 6;
  string user_id = 7;
}

message PublishRequest {
  Event event = 1;
}

message PublishResponse {
  string event_id = 1;
  bool kafka_accepted = 2;
}

message PublishSummary {
  uint64 accepted = 1;
  uint64 rejected = 2;
}
